<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- NOTE TO SELF: Defer allows the input boxes exist before the script runs-->
    <script type="text/javascript" src="../js/temperature-converter.js" defer></script>
    <link rel="stylesheet" type="text/css" href="../css/index.css">
    <title>Temperature Converter</title>
</head>
<body>
    <h1>Temperature Converter Calculator</h1>
    <!-- 1. Detect which box user has typed in -->
    <!-- 2. If the user typed in one box, the other box will provide an immediate converted value -->
    <!-- User is able to have the inputs switch sides -->

    <div class="temperature">
        <label for="Celsius">Celsius: <input type="text" id="cDegree" name="cDegree"></label>
        <label for="Fahrenheit">Fahrenheit: <input type="text" id="fDegree" name="fDegree"></label>
    </div>
</body>
</html>
