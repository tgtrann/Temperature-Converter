<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- NOTE TO SELF: Defer allows the input boxes to exist before the script runs-->
    <script type="text/javascript" src="../js/temperature-converter.js" defer></script>
    <link rel="stylesheet" type="text/css" href="../css/index.css">
    <title>Temperature Converter</title>
</head>
<body>
    <h1>Temperature Converter Calculator</h1>
    <div class="temperature">
         <label for="left-input" class="field">
            <span id="left-label">Celsius: </span>
            <input type="text" id="left-input" name="celsius" inputmode="decimal">
        </label>
        <button id="convert-to-arrow" type="button" aria-label="switch sides"><img src="../imgs/doubleArrow.png" alt="switch sides"></button>
        <label for="right-input" class="field">
            <span id="right-label">Fahrenheit: </span>
            <input type="text" id="right-input" name="fahrenheit" inputmode="decimal">
        </label>
    </div>
</body>
</html>
